[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-profiles-catalog"
version = "0.1.0"
description = "A catalog of I and H steel profiles for construction, including only their basic geometrical information"
authors = [{name = "Victor-MaitreBallesteros"}]
requires-python = ">=3.7"

[tool.setuptools]
# Indique le dossier qui contient le code
packages = ["steel_profiles"]

[tool.setuptools.package-data]
# Indique à pip d'embarquer les fichiers CSV lors de l'installation
steel_profiles = ["data/*.csv"]